<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50" width="340" height="50" fill="none" role="img" aria-label="PolicyGuide US - America's Independent Insurance Authority">
  <defs>
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C48C"/>
      <stop offset="50%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    
    <!-- Shield Stroke Glow -->
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Badge US Gradient -->
    <linearGradient id="usBadgeGrad" x1="0" y1="0" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Text Gradient for GUIDE -->
    <linearGradient id="guideGrad" x1="0" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A86B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crest / Shield Mark (Width: 44, Height: 44) -->
  <g transform="translate(3, 3)">
    <!-- Base Shield -->
    <path d="M22 2 C32 2 39 6 41 14 C41 27 29 37 22 41 C15 37 3 27 3 14 C5 6 12 2 22 2 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#shieldStroke)" 
          stroke-width="1.75" 
          filter="url(#subtleGlow)"/>
    
    <!-- Inner Polished Bevel Accent -->
    <path d="M22 6 C29 6 34 9 36 15 C36 24 27 32 22 35 C17 32 8 24 8 15 C10 9 15 6 22 6 Z" 
          fill="#0B132B" 
          fill-opacity="0.45"/>

    <!-- National Star at Top of Shield -->
    <polygon points="22,9 23.4,13.2 27.8,13.2 24.2,15.8 25.6,20 22,17.4 18.4,20 19.8,15.8 16.2,13.2 20.6,13.2" 
             fill="#FCD34D" />

    <!-- Security Checkmark -->
    <path d="M15 22.5 L19.5 27 L29 17.5" 
          stroke="#FFFFFF" 
          stroke-width="2.75" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Typography Content -->
  <!-- Main Brand Row -->
  <g transform="translate(56, 24)">
    <!-- Word: POLICY -->
    <text x="0" y="0" 
          font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="20" 
          letter-spacing="0.5" 
          fill="#FFFFFF">POLICY</text>
    
    <!-- Word: GUIDE -->
    <text x="82" y="0" 
          font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="20" 
          letter-spacing="0.5" 
          fill="url(#guideGrad)">GUIDE</text>
    
    <!-- US National Registry Pill Badge -->
    <g transform="translate(154, -15)">
      <rect width="28" height="17" rx="4" fill="url(#usBadgeGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8"/>
      <text x="14" y="12" 
            text-anchor="middle" 
            font-family="'Space Grotesk', sans-serif" 
            font-weight="900" 
            font-size="10.5" 
            fill="#FFFFFF" 
            letter-spacing="0.5">US</text>
    </g>

    <!-- 50-State Trust Pill (Authority Indicator) -->
    <g transform="translate(190, -15)">
      <rect width="86" height="17" rx="4" fill="#064E3B" fill-opacity="0.75" stroke="#10B981" stroke-width="0.85"/>
      <circle cx="8" cy="8.5" r="2.5" fill="#34D399"/>
      <text x="47" y="12" 
            text-anchor="middle" 
            font-family="'Plus Jakarta Sans', sans-serif" 
            font-weight="700" 
            font-size="8.5" 
            fill="#A7F3D0" 
            letter-spacing="0.4">50-STATE VERIFIED</text>
    </g>
  </g>

  <!-- Tagline / Subtitle Row (Authoritative Long Form) -->
  <g transform="translate(57, 39)">
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="8" 
          letter-spacing="1.4" 
          fill="#94A3B8">AMERICA'S INDEPENDENT INSURANCE AUTHORITY</text>
  </g>
</svg>
