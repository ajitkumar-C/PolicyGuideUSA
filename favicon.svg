<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favShieldGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="45%" stop-color="#00D26A"/>
      <stop offset="100%" stop-color="#0099FF"/>
    </linearGradient>
    <linearGradient id="favBorderGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="favInnerBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#061325"/>
    </radialGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00D26A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M32 4 C46 4 58 9 60 21 C60 40 43 54 32 60 C21 54 4 40 4 21 C6 9 18 4 32 4 Z" 
        fill="url(#favShieldGrad)" 
        filter="url(#favGlow)"/>
  
  <!-- Sleek Contrast Inner Chamber -->
  <path d="M32 8 C43 8 53 12 55 22 C55 37 40 49 32 54 C24 49 9 37 9 22 C11 12 21 8 32 8 Z" 
        fill="url(#favInnerBg)" 
        stroke="url(#favBorderGrad)" 
        stroke-width="1.75"/>

  <!-- Federal Gold Authority Star -->
  <polygon points="32,13 34.2,19.2 40.5,19.2 35.4,22.8 37.4,29 32,25.3 26.6,29 28.6,22.8 23.5,19.2 29.8,19.2" 
           fill="#FFD23F" 
           stroke="#F59E0B" 
           stroke-width="0.5"/>

  <!-- Bold Verified Trust Checkmark (Readable at 16x16) -->
  <path d="M21 34.5 L28.5 42 L43 27" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
